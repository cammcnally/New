name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/_test.yml

  contracts:
    name: Contract verification
    uses: ./.github/workflows/_contracts.yml

  ge-suites:
    name: GE suite validation
    uses: ./.github/workflows/_data-contracts.yml

  market-data:
    name: Canonical market-data verification
    uses: ./.github/workflows/_market-data.yml

  generated-drift:
    name: Generated file drift check
    uses: ./.github/workflows/_regenerate-check.yml
