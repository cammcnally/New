sources:
  yfinance:
    enabled: true
    source_class: required_core
    roles:
      - ohlcv_daily_primary
      - benchmark_prices_primary
    raw:
      datasets:
        - daily
    bronze:
      datasets:
        - yfinance_daily
    notes: "Primary daily OHLCV and benchmark/reference price source."
  stooq:
    enabled: true
    source_class: supplemental_support
    roles:
      - ohlcv_daily_secondary
      - intraday_secondary
      - price_conflict_diagnostics
    raw:
      datasets:
        - daily
        - intraday
    bronze:
      datasets:
        - stooq_daily
        - stooq_intraday
    notes: "Secondary price source and intraday support for diagnostics and coverage backfill."
  alphavantage:
    enabled: true
    source_class: required_core
    roles:
      - listing_metadata_primary
      - symbol_metadata_support
      - corporate_actions_support
    raw:
      datasets:
        - listing_status
        - daily_adjusted
    bronze:
      datasets:
        - av_listing_status
        - av_daily_adjusted
    notes: "Primary listing/company metadata plus adjustment and corporate-action support."
  sec:
    enabled: true
    source_class: optional_enrichment
    roles:
      - company_fundamentals_authoritative_when_available
      - legal_name_authoritative_when_available
      - entity_verification_support
    raw:
      datasets:
        - submissions
        - companyfacts
    bronze:
      datasets:
        - sec_submissions
        - sec_companyfacts
    notes: "Authoritative legal-name and public-filing/fundamental support when available."
  fred:
    enabled: true
    source_class: optional_enrichment
    roles:
      - macro_vintages_authoritative_when_available
    raw:
      datasets:
        - observations
        - vintages
    bronze:
      datasets:
        - fred_observations
        - fred_vintages
    notes: "Macro time series with vintages and as-of reconstruction support."
