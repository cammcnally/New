# Narrow reproducibility spine: compatibility export + sidecar manifest.
# Full lake outputs live under data_lake/ (gitignored) and are not tracked here.
# Materialize with: uv run python tools/run_repo_e2e.py --stop-after export_panel
stages:
  market_data_e2e_export:
    cmd: uv run python tools/run_repo_e2e.py --stop-after export_panel
    deps:
      - tools/run_repo_e2e.py
      - market_data/orchestration/e2e.py
      - market_data/orchestration/run_all.py
      - market_data/orchestration/sync.py
      - market_data/bridge/export_pipeline_panel.py
      - tools/verify_market_data.py
      - tools/verify_market_data_contracts.py
      - tools/verify_market_data_bridge.py
      - tools/verify_market_data_pit.py
      - tools/verify_market_data_docs_sync.py
      - tools/verify_market_data_common.py
      - Pipeline.py
      - configs/
    outs:
      - panel_ohlcv_clean.csv:
          cache: true
      - panel_ohlcv_clean.csv.manifest.json:
          cache: true
