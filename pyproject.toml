[project]
name = "swing-pipeline"
version = "0.1.0"
requires-python = ">=3.11.9,<3.12"
description = "Walk-forward swing-trading research pipeline"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=1.3.0",
    "pandas-stubs>=2.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "lightgbm>=4.0.0",
    "tabulate>=0.8.9",
    "optuna>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]
control-plane = [
    "openai>=2.29",
    "openai-agents>=0.12",
    "python-dotenv>=1.2",
]
data = [
    "great-expectations>=1.3",
    "dvc>=3.55",
    "dvclive>=3.48",
]
ml = [
    "mlflow>=2.21",
]
orchestrator = [
    "dagster>=1.10",
    "dagster-webserver>=1.10",
]
lineage = [
    "openlineage-python>=1.28",
]
ingestion = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "orjson>=3.9",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "polars>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pandera>=0.20",
    "exchange-calendars>=4.5",
    "python-dotenv>=1.0",
    "zstandard>=0.22",
    "click>=8.1",
    "jinja2>=3.1",
    "yfinance>=1.2.0",
]
ingestion-test = [
    "pytest>=9.0",
    "respx>=0.21",
    "freezegun>=1.2",
    "polyfactory>=2.0",
]
analysis = [
    "alphalens-reloaded==0.4.6",
]
